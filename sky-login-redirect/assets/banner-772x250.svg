<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="772" height="250" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="650" cy="50" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="700" cy="180" r="60" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="200" r="40" fill="#ffffff" opacity="0.08"/>

  <!-- Main redirect icon (larger, centered left) -->
  <g transform="translate(60, 75)">
    <circle cx="50" cy="50" r="55" fill="#ffffff" opacity="0.15"/>
    <path d="M77.18 48a2.816 2.816 0 0 1 2.82 2.836v12.816a2.816 2.816 0 0 1-2.8 2.836a2.816 2.816 0 0 1-2.8-2.836v-4.5C67.116 71.376 53.596 80 39.028 80c-17.64 0-32.424-10.884-38.836-27.66a2.848 2.848 0 0 1 1.6-3.668c1.44-.564 3.064.16 3.624 1.62c5.6 14.648 18.352 24.04 33.612 24.04c13.484 0 26.08-8.728 31.948-20.616l-5.884.04a2.816 2.816 0 0 1-2.82-2.816a2.82 2.82 0 0 1 2.78-2.856L77.18 48ZM38.98 0c17.632 0 32.42 10.884 38.832 27.66a2.848 2.848 0 0 1-1.6 3.668a2.788 2.788 0 0 1-3.624-1.62c-5.6-14.648-18.352-24.04-33.612-24.04c-13.484 0-26.08 8.728-31.948 20.616l5.884-.04a2.816 2.816 0 0 1 2.82 2.816a2.82 2.82 0 0 1-2.78 2.856L2.82 32A2.816 2.816 0 0 1 0 29.164V16.348c0-1.568 1.252-2.836 2.8-2.836c1.544 0 2.8 1.268 2.8 2.836v4.5C12.884 8.624 26.404 0 38.98 0Z"
          fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Plugin name -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">
    Sky Login Redirect
  </text>

  <!-- Tagline -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#ffffff" opacity="0.9">
    Smart Login &amp; Logout Redirects for WordPress
  </text>

  <!-- Feature badges -->
  <g transform="translate(200, 165)">
    <!-- WooCommerce badge -->
    <rect x="0" y="0" width="140" height="28" rx="14" fill="url(#accentGradient)"/>
    <text x="70" y="19" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      WooCommerce
    </text>

    <!-- Performance badge -->
    <rect x="150" y="0" width="130" height="28" rx="14" fill="#ffffff" opacity="0.2"/>
    <text x="215" y="19" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      Performance
    </text>

    <!-- Security badge -->
    <rect x="290" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.2"/>
    <text x="345" y="19" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      Security
    </text>
  </g>
</svg>
