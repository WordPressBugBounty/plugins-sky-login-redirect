ignore:
  - paths:
      - "vendor/composer/installers/.github/workflows/*.yml"
    rules:
      - "R-B9218"
    reason: "Composer dependency metadata under a nested .github directory is never executed as this repository's GitHub Actions workflow."
  - paths:
      - "assets/js/admin-notices.js"
      - "assets/js/slr.js"
    rules:
      - "R-0385C"
    reason: "These are browser fetches, not server-side requests; both URLs are generated by WordPress from fixed same-origin plugin/admin paths."
  - paths:
      - "dev/readme-fr_FR.po"
      - "sky-login-redirect.php"
    rules:
      - "R-56BBC"
    reason: "The runtime default trusts only socket-level REMOTE_ADDR; proxy headers require an explicit site-owner filter for a trusted proxy deployment, and the PO entry is documentation text."
  - paths:
      - "assets/js/slr.js"
    rules:
      - "R-82D8E"
    reason: "The image URL comes from the plugin's checked-in same-origin catalog, not user-controlled input; modifying it requires code/filesystem write access."
  - paths:
      - "premium/ajax-login-script.js"
    rules:
      - "R-6C5D6"
    reason: "The redirect is validated server-side with WordPress wp_validate_redirect before it is returned in the authenticated AJAX response."
  - paths:
      - "premium/restrict.php"
    rules:
      - "R-B0873"
    reason: "An empty legacy string safely fails the anchored ID pattern and returns 0; it does not reach a dangerous sink or grant access."
  - paths:
      - "vendor/htmlburger/carbon-fields/yarn.lock"
    rules:
      - "R-33F4D"
      - "R-668D8"
      - "R-E7E4B"
      - "R-7A3E3"
      - "R-28B0F"
      - "R-2321F"
      - "R-4C2B2"
      - "R-B0EF7"
    reason: "Upstream Carbon Fields build lockfile: Showdown, lodash-es, PostCSS, and YAML have no runtime call sites; Nano ID receives only a fixed/default size; Lodash omit/unset paths derive from developer-defined field IDs; and compiled bundles contain no vulnerable Babel named-capture helper. A lockfile-only edit would not rebuild the runtime bundles."
